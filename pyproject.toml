[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sf-smartsim"
version = "3.0.0"
description = "Simulate before it hits you. See your role's task-by-task collapse sequence."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "SmartTasks Lab" }]
keywords = ["smart", "ai", "iaiso", "sf-smartsim", "devtools"]
dependencies = []
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://smarttasks.cloud"
Source = "https://github.com/SmartTasksOrg/sf-smartsim"
Issues = "https://github.com/SmartTasksOrg/sf-smartsim/issues"
Security = "https://github.com/SmartTasksOrg/sf-smartsim/security/policy"
Changelog = "https://github.com/SmartTasksOrg/sf-smartsim/blob/master/CHANGELOG.md"
Standard = "https://iaiso.org"

[project.scripts]
sf-smartsim = "sf_smartsim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
